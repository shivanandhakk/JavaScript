<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Object Methods - Book</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>Object Methods</h1>
        <h4>Object methods are actions that can be performed on objects.
            <br>A method is a function definition stored as a property value.</h4>
        <h4>In an object method, "this" refers to the object.</h4>
        <p id="objmethods"></p>

        <script>  
            const person = {
            firstName: "John",
            lastName: "Doe",
            age: 50,
            fullName: function() {
                return this.firstName + " " + this.lastName;
            }
            };

            document.getElementById("objmethods").innerHTML = person.fullName(); 
        </script>
    </body>
</html>
