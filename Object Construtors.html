
<!DOCTYPE html>
<html>
    <head>
        <title>Object Constructors</title>
        <style>
            body {
                background-color: #e1eaf5;
                font-family: Arial, sans-serif;
                max-width: 900px;
                margin: 30px auto;
                padding: 20px;
            }

            h1 {
                color: #174a6e;
                text-align: center;
                border-bottom: 2px solid #5aa6a6;
                padding-bottom: 12px;
            }

            h3 {
                margin-top: 25px;
            }

            hr {
                border: none;
                border-top: 1px solid #cbd5df;
                margin: 22px 0;
            }

            p {
                background-color: #ffffff;
                border-left: 4px solid #5aa6a6;
                padding: 12px 16px;
                border-radius: 5px;
                line-height: 1.6;
            }
        </style>
    </head>
    <body>
        <h1>Object Constructors</h1>

        <p id = "demo"></p>
        <hr>

        <h3>Property Default Values:</h3>
        <p id = "demo1"></p>
        <hr>

        <h3>Add Property to an Object:</h3>
        <p id = "demo2"></p>
        <hr>

        <h3>Adding a Property to a Constructor:</h3>
        <p id = "demo3"></p>
        <hr>

        <h3>Adding a Property to a Constructor function "Prototype":</h3>
        <p id = "demo4"></p>
        <hr>

        <h3>Constructor Function:</h3>
        <p id = "demo5"></p>
        <hr>

        <h3>Adding a Method to an Object:</h3>
        <p id = "demo6"></p>
        <hr>

        <h3>Adding a Method to a Constructor:</h3>
        <p id = "demo7"></p>
        <hr>

    <script>
    // Constructor Function for Person objects
        function Person(first, last, age, city) {
            this.firstname = first;
            this.lastname = last;
            this.age = age;
            this.city = city;
        // Property Default Value
            this.nationality = "Indian";
        // Constructore funtion
            this.fullname = function() {
                return this.firstname + " " + this.lastname;
            };  
        }

    // Create two Person objects
        const myFather = new Person("John", "Doe", 50, "Chennai");
        const myMother = new Person("Riya", "John", 47, "Coimbatore");

    // Add Property to an Object
       myFather.occupation = "Business man";  

    // Adding a Method to an Object   
       myMother.changeName = function(name) {
        this.lastname = name;
       }

    // Change value
       myMother.changeName("Martin");   

    /* Adding a Method to a Constructor:   
       You cannot add a new method to an object constructor function.
       This code will produce a TypeError.
       Person.changeName = function(name) {
        return this.firstname = name;
       }
    
        myFather.changeName("Johny");
     */   

    // Adding a new method to a constructor must be done to the constructor function "prototype".   
       Person.prototype.changeName = function(name) {
        return this.firstname = name;
       }

       myFather.changeName("Johny");   

       document.getElementById("demo").innerHTML =
       "My father is " + myFather.age + "." +
       " My mother is " + myMother.age + "." ;
        
    // Displaying Default Value    
       document.getElementById("demo1").innerHTML = 
       "My Father is an " + myFather.nationality + "." +
       " My Mother is an " + myMother.nationality + "." ;

    // Displaying Property to an Object
       document.getElementById("demo2").innerHTML = 
       "My Father is a " + myFather.occupation + "." ;
              
    // Adding a Property to a Constructor
       Person.language = "Malayalam";
    // We can NOT add a new property to an object constructor.   

    // Displaying Property to a Constructor   
       document.getElementById("demo3").innerHTML = 
       "My Mother speaks " + myMother.language + "." ;

    // To add a new property, must add it to the constructor function "prototype".
       Person.prototype.language = "Malayalam";       

    // Add a new property using constructor function "prototype"
       document.getElementById("demo4").innerHTML = 
       "My Father speaks " + myFather.language + "." ;

    // Displaying Constructor Function   
       document.getElementById("demo5").innerHTML = 
       "My Mother is " + myMother.fullname() + "." ; 

    // Adding a Method to an Object   
       document.getElementById("demo6").innerHTML = 
       "My mother's last name is " + myMother.lastname + "." ;
    
    // Adding a Method to a Constructor   
       document.getElementById("demo7").innerHTML =
       "My father's first name is " + myFather.firstname;   

    </script>  
    </body>
</html>
